<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coffee Shop POS</title>
<style>
:root{--bg:#f6f1ea;--card:#fff;--ink:#2b2018;--mut:#7a6a5c;--brand:#6f4e37;--brand2:#a47148;--ok:#2f7d4f;--warn:#c47f17;--bad:#b3392f;--line:#e6dccf}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--brand);color:#fff}
button.ghost{background:#fff;color:var(--brand);border:1px solid var(--line)}
button.bad{background:var(--bad)}
button.ok{background:var(--ok)}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
header{background:var(--brand);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1}
header .badge{background:rgba(255,255,255,.2);color:#fff}
nav{display:flex;gap:6px}
nav button{background:rgba(255,255,255,.15)}
nav button.on{background:#fff;color:var(--brand);font-weight:600}
main{padding:14px;max-width:1300px;margin:0 auto}
.view{display:none}.view.on{display:block}
.pos{display:grid;grid-template-columns:1fr 380px;gap:14px;align-items:start}
@media(max-width:900px){.pos{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cats button{background:#fff;color:var(--brand);border:1px solid var(--line);padding:6px 12px}
.cats button.on{background:var(--brand);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:4px;min-height:84px}
.item:hover{border-color:var(--brand2)}
.item b{font-size:15px}.item span{color:var(--brand2);font-weight:600}
.item small{color:var(--mut)}
.item.out{opacity:.45}
.search{margin-bottom:10px}
.ci{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.ci .sub{color:var(--mut);font-size:12px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{padding:2px 9px;background:#fff;color:var(--brand);border:1px solid var(--line)}
.amt{min-width:70px;text-align:right;font-weight:600}
.empty{color:var(--mut);text-align:center;padding:22px 0}
.row{display:flex;justify-content:space-between;margin:5px 0}
.row.total{font-size:20px;font-weight:700;border-top:2px solid var(--ink);padding-top:8px;margin-top:8px}
.lbl{font-size:12px;color:var(--mut);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.quick button{padding:5px 10px;background:#fff;color:var(--brand);border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip input{display:none}
.chip span{display:inline-block;padding:7px 12px;border:1px solid var(--line);border-radius:999px;cursor:pointer;background:#fff}
.chip input:checked+span{background:var(--brand);color:#fff;border-color:var(--brand)}
.queue{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:800px){.queue{grid-template-columns:1fr}}
.ticket{border:1px solid var(--line);border-left:6px solid var(--warn);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.ticket.ready{border-left-color:var(--ok)}
.ticket h4{margin:0 0 6px;display:flex;justify-content:space-between}
.ticket ul{margin:6px 0 10px;padding-left:18px}
.ticket li small{color:var(--mut)}
.ticket .cust{background:#faf6f0;border-radius:8px;padding:6px 8px;margin:6px 0;font-size:13px}
.badge{font-size:12px;padding:2px 8px;border-radius:999px;background:#eee;color:var(--mut)}
.subtabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.subtabs button{background:#fff;color:var(--brand);border:1px solid var(--line)}
.subtabs button.on{background:var(--brand);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase}
td.n,th.n{text-align:right}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.stat small{color:var(--mut)}.stat div{font-size:22px;font-weight:700}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:10px}
.toolbar>div{min-width:140px}
.low{color:var(--bad);font-weight:600}
.neg{color:var(--bad)}.pos-n{color:var(--ok)}
.warnbox{background:#fff4e0;border:1px solid #f0cf94;color:#7a4b00;border-radius:10px;padding:9px 12px;margin:10px 0;font-size:14px}
.chartbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0;overflow-x:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-top:4px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.void{text-decoration:line-through;color:var(--mut)}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:14px}
#overlay.on{display:flex}
#modal{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:440px;max-height:92vh;overflow:auto}
#modal h3{margin:0 0 8px}
#modal.wide{max-width:640px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:30;max-width:90vw;text-align:center}
.receipt{font-family:"Courier New",monospace;font-size:13px;width:100%;max-width:300px;margin:0 auto}
.receipt .c{text-align:center}.receipt hr{border:0;border-top:1px dashed #000;margin:8px 0}
.receipt .r{display:flex;justify-content:space-between;gap:8px}
.receipt .it{display:grid;grid-template-columns:1fr 30px 66px;gap:4px;align-items:start}
.receipt .it span:nth-child(2){text-align:center}.receipt .it span:nth-child(3){text-align:right}
.receipt .eq{border-top:3px double #000;margin:8px 0}
.receipt .t{font-weight:700;font-size:15px}
.receipt .sm{font-size:12px}
.receipt .logo{display:block;max-width:75%;max-height:100px;margin:0 auto 6px}
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
#auth .box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;width:100%;max-width:420px}
#auth h2{margin:0 0 4px}
#auth ol{padding-left:18px;line-height:1.6}
.err{color:var(--bad);margin:8px 0;font-size:14px}
code{background:#f1e9df;padding:1px 5px;border-radius:5px}
@media print{
  body *{visibility:hidden}
  #receiptPrint,#receiptPrint *{visibility:visible}
  #receiptPrint{position:absolute;left:0;top:0;width:58mm;max-width:none}
}
</style>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body>

<div id="auth"></div>

<div id="app" style="display:none">
  <header>
    <h1 id="shopName">Coffee POS</h1>
    <nav>
      <button id="nav-pos" onclick="go('pos')">POS</button>
      <button id="nav-bar" onclick="go('bar')">Barista</button>
      <button id="nav-admin" onclick="go('admin')">Admin</button>
    </nav>
    <span class="badge" id="who"></span>
    <span class="badge" id="net"></span>
    <button class="ghost" onclick="logout()">Logout</button>
  </header>
  <main>
    <section id="v-pos" class="view">
      <div class="pos">
        <div class="card">
          <input class="search" id="q" placeholder="Search items..." oninput="renderMenu()">
          <div class="cats" id="cats"></div>
          <div class="grid" id="menuGrid"></div>
        </div>
        <div class="card">
          <h3 style="margin:0 0 6px">Current Order</h3>
          <div class="two">
            <select id="otype" onchange="renderTotals()"><option>Dine-in</option><option>Take-out</option><option>Delivery</option></select>
            <button class="ghost" onclick="clearCart()">Clear all</button>
          </div>
          <div id="cartList"></div>
          <div id="custBox" style="display:none">
            <div class="lbl">Customer</div>
            <input id="cName" list="custNames" placeholder="Customer name" autocomplete="off">
            <datalist id="custNames"></datalist>
            <input id="cPhone" placeholder="Phone (optional)" style="margin-top:6px">
            <div id="delBox" style="display:none">
              <textarea id="cAddr" rows="2" placeholder="Delivery address" style="margin-top:6px"></textarea>
              <input id="dFee" type="number" min="0" step="0.01" placeholder="Delivery fee (optional)" oninput="renderTotals()" style="margin-top:6px">
            </div>
          </div>
          <div class="lbl">Discount</div>
          <div class="two">
            <select id="disc" onchange="renderTotals()"><option value="none">No discount</option><option value="pwd">PWD / Senior</option><option value="custom">Custom %</option></select>
            <input id="customPct" type="number" min="0" max="100" placeholder="%" style="display:none" oninput="renderTotals()">
          </div>
          <div class="row" style="margin-top:12px"><span>Subtotal</span><span id="tSub"></span></div>
          <div class="row" id="rVex" style="display:none"><span>Less: VAT exemption (SC/PWD)</span><span id="tVex"></span></div>
          <div class="row"><span>Discount</span><span id="tDisc"></span></div>
          <div class="row" id="rVatAdd" style="display:none"><span id="lVatAdd">VAT</span><span id="tVatAdd"></span></div>
          <div class="row" id="rFee" style="display:none"><span>Delivery fee</span><span id="tFee"></span></div>
          <div class="row total"><span>Total</span><span id="tTotal"></span></div>
          <div class="row" id="rVatInc" style="display:none;color:var(--mut);font-size:13px"><span id="lVatInc">VAT included</span><span id="tVatInc"></span></div>
          <div class="lbl">Payment</div>
          <select id="pay" onchange="onPayChange()"><option value="Cash">Cash</option><option value="GCash">GCash</option><option value="Credit">Credit (utang)</option></select>
          <div id="creditNote" class="warnbox" style="display:none">Customer pays later. The balance is recorded under Admin &gt; Credits.</div>
          <div id="cashBox">
            <input id="tender" type="number" min="0" placeholder="Cash received" oninput="renderTotals()" style="margin-top:6px">
            <div class="quick" id="quick"></div>
            <div class="row"><span>Change</span><b id="tChange">₱0.00</b></div>
          </div>
          <button id="placeBtn" class="ok" style="width:100%;margin-top:12px;padding:13px;font-size:16px" onclick="placeOrder()">Complete order</button>
        </div>
      </div>
    </section>

    <section id="v-bar" class="view">
      <div class="queue">
        <div><h3>Preparing <span class="badge" id="cPrep"></span></h3><div id="qPrep"></div></div>
        <div><h3>Ready <span class="badge" id="cReady"></span></h3><div id="qReady"></div></div>
      </div>
    </section>

    <section id="v-admin" class="view"><div id="adminBody"></div></section>
  </main>
</div>

<div id="overlay"><div id="modal"></div></div>
<div id="toast"></div>

<script>
/* =====================================================================
   1) PASTE YOUR FIREBASE CONFIG HERE
      Firebase Console > Project settings > Your apps > Web app > Config
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBrI7fMdXpnhX8sCYOvhYjQFrUi1DsF6Z4",
  authDomain: "coffee-shop-pos-1a64c.firebaseapp.com",
  projectId: "coffee-shop-pos-1a64c",
  storageBucket: "coffee-shop-pos-1a64c.firebasestorage.app",
  messagingSenderId: "289026657293",
  appId: "1:289026657293:web:048d5da3dcc0ded55d5944"
};
const CONFIGURED = !String(FIREBASE_CONFIG.apiKey).startsWith('PASTE');

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'₱'+(Number(n)||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const r2=n=>Math.round(n*100)/100;
const pad=n=>String(n).padStart(2,'0');
const dstr=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const todayStr=()=>dstr(Date.now());
const tstr=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
function toast(t,ms){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',ms||3000)}
let draftKind=null,draftId=null,INGLOADED=false,MENULOADED=false;
function modal(h){$('#modal').classList.remove('wide');draftKind=null;try{localStorage.removeItem('pos_draft')}catch(e){}$('#modal').innerHTML=h;$('#overlay').classList.add('on')}
/* unsaved item / ingredient forms survive a page refresh */
function setDraft(kind,id){draftKind=kind;draftId=id;saveDraft()}
function saveDraft(){
  if(!draftKind)return;
  const vals={};
  document.querySelectorAll('#modal input[id],#modal select[id],#modal textarea[id]').forEach(el=>{vals[el.id]=el.type==='checkbox'?el.checked:el.value});
  const rows=[...document.querySelectorAll('#modal .rrow')].map(r=>({ing:r.querySelector('.rIng').value,qty:r.querySelector('.rQty').value}));
  try{localStorage.setItem('pos_draft',JSON.stringify({kind:draftKind,id:draftId,vals,rows,ts:Date.now()}))}catch(e){}
}
function restoreDraft(n){
  let d=null;try{d=JSON.parse(localStorage.getItem('pos_draft'))}catch(e){}
  if(!d||!ME||ME.role!=='admin'||Date.now()-(d.ts||0)>12*3600*1000)return;
  n=n||0;
  const ready=INGLOADED&&MENULOADED&&(d.kind==='ing'?(!d.id||ingById(d.id)):(!d.id||MENU.find(m=>m.id===d.id)));
  if(!ready){if(n<25)setTimeout(()=>restoreDraft(n+1),300);return}
  if(modalOpen())return;
  if(d.kind==='ing')editIng(d.id);else editItem(d.id);
  Object.entries(d.vals||{}).forEach(([k,v])=>{const el=document.getElementById(k);if(!el)return;if(el.type==='checkbox')el.checked=!!v;else el.value=v});
  if(d.kind==='item'&&d.rows&&$('#rList'))$('#rList').innerHTML=d.rows.filter(r=>ingById(r.ing)).map(recipeRowHTML).join('');
  saveDraft();
}
function closeModal(){draftKind=null;try{localStorage.removeItem('pos_draft')}catch(e){}$('#overlay').classList.remove('on');if(view==='admin'){if(aTab==='menu')aMenu();else if(aTab==='ing')aIng()}}
function modalOpen(){return $('#overlay').classList.contains('on')}
function errMsg(e){
  const c=(e&&e.code)||'';
  const m={'auth/invalid-credential':'Incorrect email or password','auth/wrong-password':'Incorrect email or password','auth/user-not-found':'Incorrect email or password',
    'auth/invalid-email':'Invalid email address','auth/email-already-in-use':'That email is already in use','auth/weak-password':'Password is too short (min 6 characters)',
    'auth/network-request-failed':'No internet connection','auth/too-many-requests':'Too many attempts, please wait a moment',
    'permission-denied':'You do not have permission for this action','unavailable':'Cannot reach the server','auth/operation-not-allowed':'Enable Email/Password in Firebase Authentication'};
  return m[c]||(e&&e.message)||'Something went wrong';
}
function download(name,text,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* ---------- defaults ---------- */
function defaultSettings(){
  return {shop:'Kape Corner',pwdRate:20,vatOn:false,vatRate:12,vatMode:'incl',pwdVatExempt:true,blockOnOut:true,address:'',phone:'',tin:'',footer:'',logo:'',
    sizes:[{n:'Small',up:0,mult:1},{n:'Medium',up:10,mult:1.25},{n:'Large',up:20,mult:1.5}],addonUse:[],
    addons:[{n:'Extra shot',p:20},{n:'Oat milk',p:30},{n:'Whipped cream',p:15},{n:'Caramel syrup',p:15}]};
}
function seedMenu(){
  const d=(name,cat,price)=>({name,cat,price,sized:true,track:false,stock:0});
  const p=(name,price,stock)=>({name,cat:'Pastry',price,sized:false,track:true,stock});
  return [d('Americano','Coffee',90),d('Cafe Latte','Coffee',120),d('Cappuccino','Coffee',120),d('Caramel Macchiato','Coffee',140),d('Spanish Latte','Coffee',140),
    d('Matcha Latte','Non-coffee',140),d('Hot Chocolate','Non-coffee',120),d('Iced Tea','Non-coffee',80),
    p('Croissant',85,12),p('Banana Bread',70,10),p('Choco Chip Cookie',55,15)];
}

/* ---------- state ---------- */
let fs,auth,ME=null,S=defaultSettings(),MENU=[],ORDERS=[],RORDERS=[],REXP=[],STAFF=[],ING=[],CREDITS=[],CGROUPS=[],unsubs=[];
let settingUp=false,placing=false,paying=false,payTarget=null,custNamesAt=0;
let cart=[],cat='All',view='pos',aTab='dash',rf=todayStr(),rt=todayStr();
const can={pos:['admin','cashier'],bar:['admin','cashier','barista'],admin:['admin']};

/* =====================================================================
   AUTH SCREENS
   ===================================================================== */
function renderAuth(mode,msg){
  $('#app').style.display='none';
  const a=$('#auth');a.style.display='flex';
  const err=msg?`<div class="err">${esc(msg)}</div>`:'';
  if(mode==='config'){
    a.innerHTML=`<div class="box"><h2>Set up Firebase</h2><p>Not connected to Firebase yet. Do this once:</p>
    <ol><li>Create a project at <b>console.firebase.google.com</b></li>
    <li><b>Authentication</b> → Sign-in method → enable <b>Email/Password</b></li>
    <li><b>Firestore Database</b> → Create database</li>
    <li>Firestore → <b>Rules</b> → paste the contents of <code>firestore.rules</code> → Publish</li>
    <li>Project settings → Your apps → Web app → copy the config and paste it into <code>FIREBASE_CONFIG</code> at the top of the script in <code>index.html</code></li>
    <li>Deploy (Firebase Hosting or GitHub Pages) or open the page, then do the first-time setup</li></ol></div>`;
  }else if(mode==='setup'){
    a.innerHTML=`<div class="box"><h2>First-time setup</h2><p style="color:var(--mut);margin-top:0">Create the Admin account. Do this right after deploying.</p>
    <div class="lbl">Shop name</div><input id="suShop" placeholder="e.g. Kape Corner">
    <div class="lbl">Your name</div><input id="suName">
    <div class="lbl">Email</div><input id="suEmail" type="email">
    <div class="lbl">Password (min 6)</div><input id="suPass" type="password" onkeydown="if(event.key==='Enter')doSetup()">
    ${err}<button style="width:100%;margin-top:12px" onclick="doSetup()">Create Admin</button></div>`;
  }else{
    a.innerHTML=`<div class="box"><h2>☕ Login</h2><p style="color:var(--mut);margin-top:0">Coffee Shop POS</p>
    <div class="lbl">Email</div><input id="liEmail" type="email" onkeydown="if(event.key==='Enter')$('#liPass').focus()">
    <div class="lbl">Password</div><input id="liPass" type="password" onkeydown="if(event.key==='Enter')doLogin()">
    ${err}<button id="liBtn" style="width:100%;margin-top:12px" onclick="doLogin()">Sign in</button></div>`;
  }
}
async function doLogin(){
  const email=$('#liEmail').value.trim(),pass=$('#liPass').value;
  if(!email||!pass){renderAuth('login','Enter your email and password');return}
  $('#liBtn').disabled=true;
  try{await auth.signInWithEmailAndPassword(email,pass)}
  catch(e){renderAuth('login',errMsg(e))}
}
async function doSetup(){
  const shop=$('#suShop').value.trim()||'Coffee Shop',name=$('#suName').value.trim(),email=$('#suEmail').value.trim(),pass=$('#suPass').value;
  if(!name||!email){renderAuth('setup','Please fill in the name and email');return}
  if(pass.length<6){renderAuth('setup','Password is too short (min 6 characters)');return}
  settingUp=true;
  try{
    const cred=await auth.createUserWithEmailAndPassword(email,pass);
    const uid=cred.user.uid;
    // 1) admin profile + setup marker (rules allow this only once)
    const b=fs.batch();
    b.set(fs.collection('users').doc(uid),{name,email,role:'admin',active:true,createdAt:Date.now()});
    b.set(fs.collection('meta').doc('setup'),{done:true,by:uid,at:Date.now()});
    await b.commit();
    // 2) starter settings + sample menu (now allowed because we are admin)
    const b2=fs.batch();
    b2.set(fs.collection('settings').doc('main'),Object.assign(defaultSettings(),{shop}));
    seedMenu().forEach(m=>b2.set(fs.collection('menu').doc(),m));
    await b2.commit();
    settingUp=false;
    await bootUser(cred.user);
  }catch(e){
    settingUp=false;
    try{await auth.signOut()}catch(_){}
    renderAuth('setup',errMsg(e));
  }
}
async function logout(){try{localStorage.removeItem('pos_nav');localStorage.removeItem('pos_draft')}catch(e){}try{await auth.signOut()}catch(e){toast(errMsg(e))}}

/* =====================================================================
   BOOT
   ===================================================================== */
function init(){
  if(!CONFIGURED){renderAuth('config');return}
  firebase.initializeApp(FIREBASE_CONFIG);
  auth=firebase.auth();fs=firebase.firestore();
  fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  auth.onAuthStateChanged(async u=>{
    if(settingUp)return;
    stopListeners();
    if(!u){ME=null;await showEntry();return}

/* ----- ingredients & recipes ----- */
const ingById=id=>ING.find(x=>x.id===id);
function sizeMult(it,size){
  if(!size||!it.sized)return 1;
  const z=S.sizes.find(x=>x.n===size);return z&&z.mult>0?z.mult:1;
}
function ingStatus(g){const st=g.stock||0,lo=g.low||0;return st<=0?'out':(lo>0&&st<=lo?'low':'ok')}
function ingAlerts(){return ING.filter(g=>ingStatus(g)!=='ok')}
function recipeCost(it){ // cost of the base recipe, or null if anything is missing a price
  const r=it.recipe||[];if(!r.length)return null;
  let t=0;
  for(const x of r){const g=ingById(x.ing);if(!g||g.ucost==null)return null;t+=g.ucost*x.qty}
  return t;
}
function baseCost(it,size){
  if(it.cost!=null)return it.cost; // a typed-in cost always wins
  const rc=recipeCost(it);return rc==null?null:r2(rc*sizeMult(it,size));
}
function shortIngredient(lines){ // first ingredient that cannot cover these lines, or ''
  if(S.blockOnOut===false||!INGLOADED)return '';
  const need=ingNeed(lines);
  for(const id of Object.keys(need)){
    const g=ingById(id);
    if(g&&need[id]>(g.stock||0))return g.name+' (left: '+(g.stock||0)+' '+g.unit+')';
  }
  return '';
}
const LOG_LIMIT=150;
function addLog(oldLog,type,change,after,note){ // keeps the newest entries only
  return (oldLog||[]).concat({ts:Date.now(),type,d:r2(change),after:r2(after),by:ME.name,note:note||''}).slice(-LOG_LIMIT);
}
function ingNeed(lines){ // total ingredient amounts needed for these cart lines
  const need={};
  const add=(id,q)=>{if(id&&q>0)need[id]=(need[id]||0)+q};
  lines.forEach(c=>{
    const it=MENU.find(m=>m.id===c.id);if(!it)return;
    const mult=sizeMult(it,c.size);
    (it.recipe||[]).forEach(r=>add(r.ing,r.qty*mult*c.qty));
    (c.addons||[]).forEach(n=>(S.addonUse||[]).filter(u=>u.n===n).forEach(u=>add(u.ing,u.qty*c.qty)));
  });
  Object.keys(need).forEach(k=>need[k]=r2(need[k]));
  return need;
}
function unitCost(it,size,addons){
  const base=baseCost(it,size);
  if(base==null)return null; // cost not set yet
  const sc=size?((S.sizes.find(s=>s.n===size)||{}).cost||0):0;
  const ac=addons.reduce((a,n)=>a+((S.addons.find(x=>x.n===n)||{}).cost||0),0);
  return r2(base+sc+ac);
}
function prev(id){

function confirmItem(id){

function addToCart(it,size,addons,qty,note){
  if(it.track){
    const inCart=cart.filter(c=>c.id===it.id).reduce((a,c)=>a+c.qty,0);
    if(inCart+qty>it.stock){toast('Stock left: '+it.stock+' ('+it.name+')');return false}
  }
  const short=shortIngredient(cart.concat([{id:it.id,size,addons,qty}]));
  if(short){toast('Not enough '+short);return false}
  const key=[it.id,size,addons.slice().sort().join('+'),note].join('|');
  const ex=cart.find(c=>c.key===key);
  if(ex)ex.qty+=qty;
  else cart.push({key,id:it.id,name:it.name,size,addons,note,unit:unitPrice(it,size,addons),cost:unitCost(it,size,addons),qty});

function chg(i,d){

/* ---------- POS: cart & totals ---------- */
function calc(){
  const sub=r2(cart.reduce((a,c)=>a+c.unit*c.qty,0));
  const mode=$('#disc').value;
  let rate=0,label='';
  if(mode==='pwd'){rate=Number(S.pwdRate)||0;label='PWD/Senior '+rate+'%'}
  else if(mode==='custom'){rate=Math.min(100,Math.max(0,parseFloat($('#customPct').value)||0));label=rate?'Discount '+rate+'%':''}
  const vOn=!!S.vatOn,vr=Number(S.vatRate)||0,incl=S.vatMode!=='excl';
  const R={sub,label,vOn,vr,incl,adj:0,vatable:0,vat:0,exempt:0};
  if(!vOn){
    R.disc=r2(sub*rate/100);R.total=r2(sub-R.disc);
  }else if(mode==='pwd'&&S.pwdVatExempt!==false){
    // BIR rule: SC/PWD sale is VAT-exempt and the discount is taken on the price without VAT
    const net=incl?r2(sub/(1+vr/100)):sub;
    R.adj=r2(net-sub);R.disc=r2(net*rate/100);R.total=r2(net-R.disc);R.exempt=R.total;
  }else{
    R.disc=r2(sub*rate/100);
    const after=r2(sub-R.disc);
    if(incl){R.total=after;R.vatable=r2(after/(1+vr/100));R.vat=r2(R.total-R.vatable)}
    else{R.vatable=after;R.vat=r2(after*vr/100);R.total=r2(after+R.vat);R.adj=R.vat}
  }
  const deliveryFee=$('#otype').value==='Delivery'?Math.max(0,r2(parseFloat($('#dFee').value)||0)):0;
  R.fee=deliveryFee;R.total=r2(R.total+deliveryFee); // fee is added after discount and VAT
  return R;
}
function renderCart(){

  el.innerHTML=cart.length?cart.map((c,i)=>`<div class="ci"><div><b>${esc(c.name)}</b>${c.size?` <small>(${esc(c.size)})</small>`:''}<div class="sub">${esc(c.addons.join(', '))}${c.note?(c.addons.length?' · ':'')+'“'+esc(c.note)+'”':''}</div></div>
  <div class="qty"><button onclick="chg(${i},-1)">−</button><span>${c.qty}</span><button onclick="chg(${i},1)">+</button></div><div class="amt">${fmt(c.unit*c.qty)}</div></div>`).join(''):'<div class="empty">No items yet. Pick from the menu.</div>';
  renderTotals();
}
function renderTotals(){
  const isDelivery=$('#otype').value==='Delivery',onCredit=$('#pay').value==='Credit';
  $('#customPct').style.display=$('#disc').value==='custom'?'block':'none';
  $('#custBox').style.display=isDelivery||onCredit?'block':'none';

  $('#tSub').textContent=fmt(t.sub);$('#tDisc').textContent='− '+fmt(t.disc);$('#tTotal').textContent=fmt(t.total);
  const exm=t.vOn&&t.adj<0,add=t.vOn&&!t.incl&&t.vat>0,inc=t.vOn&&t.incl&&t.vat>0;
  $('#rVex').style.display=exm?'flex':'none';$('#tVex').textContent='− '+fmt(-t.adj);
  $('#rVatAdd').style.display=add?'flex':'none';$('#lVatAdd').textContent='VAT '+t.vr+'%';$('#tVatAdd').textContent='+ '+fmt(t.vat);
  $('#rVatInc').style.display=inc?'flex':'none';$('#lVatInc').textContent='VAT included ('+t.vr+'%)';$('#tVatInc').textContent=fmt(t.vat);
  $('#rFee').style.display=t.fee>0?'flex':'none';$('#tFee').textContent='+ '+fmt(t.fee);
  $('#cashBox').style.display=cash?'block':'none';
  const tend=parseFloat($('#tender').value)||0;
  $('#tChange').textContent=fmt(Math.max(0,tend-t.total));
  const q=[['Exact',t.total],[100,100],[200,200],[500,500],[1000,1000]];
  $('#quick').innerHTML=q.map(([l,v])=>`<button onclick="$('#tender').value=${v};renderTotals()">${typeof l==='number'?'₱'+l:l}</button>`).join('');
  $('#placeBtn').textContent=onCredit?'Save as credit':'Complete order';
  $('#placeBtn').disabled=placing||!cart.length||(cash&&tend<t.total);
}
async function placeOrder(){
  if(!cart.length||placing)return;
  const t=calc(),cash=$('#pay').value==='Cash',tend=parseFloat($('#tender').value)||0;
  const type=$('#otype').value,pay=$('#pay').value,onCredit=pay==='Credit',isDelivery=type==='Delivery';
  const custName=$('#cName').value.trim(),custPhone=$('#cPhone').value.trim(),custAddr=$('#cAddr').value.trim();
  if(cash&&tend<t.total){toast('Not enough cash received');return}
  if((onCredit||isDelivery)&&!custName){toast('Enter the customer name');return}
  if(isDelivery&&!custAddr){toast('Enter the delivery address');return}
  if(!navigator.onLine){toast('No internet. A connection is needed to save the order.');return}
  placing=true;renderTotals();
  const day=todayStr();
  const need={};cart.forEach(c=>{need[c.id]=(need[c.id]||0)+c.qty});
  const trackedIds=Object.keys(need).filter(id=>{const m=MENU.find(x=>x.id===id);return m&&m.track});
  const ineed=ingNeed(cart),ingIds=Object.keys(ineed),blockOnOut=S.blockOnOut!==false;let alerts=[];
  const orderRef=fs.collection('orders').doc();
  const cref=fs.collection('counters').doc(day);
  const items=cart.map(c=>({id:c.id,name:c.name,size:c.size,addons:c.addons,note:c.note,unit:c.unit,cost:c.cost==null?null:c.cost,qty:c.qty}));
  try{
    const order=await fs.runTransaction(async tx=>{
      const cs=await tx.get(cref);
      const mdocs=await Promise.all(trackedIds.map(id=>tx.get(fs.collection('menu').doc(id))));
      const idocs=await Promise.all(ingIds.map(id=>tx.get(fs.collection('ingredients').doc(id))));
      mdocs.forEach(d=>{
        if(!d.exists)throw new Error('An item is no longer on the menu. Please refresh the page.');
        if((d.data().stock||0)<need[d.id])throw new Error('Not enough stock for '+d.data().name);
      });
      const no=(cs.exists?(cs.data().n||0):0)+1;
      tx.set(cref,{n:no});
      mdocs.forEach(d=>tx.update(d.ref,{stock:(d.data().stock||0)-need[d.id]}));
      // ingredients: never go below zero; remember exactly what was taken so a void can put it back
      const used={};alerts=[];
      idocs.forEach(d=>{
        if(!d.exists)return;
        const g=d.data(),st=g.stock||0,take=Math.min(st,ineed[d.id]),left=r2(st-take);
        if(blockOnOut&&st<ineed[d.id])throw new Error('Not enough '+g.name+' (left: '+st+' '+g.unit+')');
        if(take>0){used[d.id]=r2(take);tx.update(d.ref,{stock:left,log:addLog(g.log,'sale',-take,left,'#'+String(no).padStart(3,'0'))})}
        if(left<=0)alerts.push(g.name+' (OUT)');
        else if((g.low||0)>0&&left<=g.low)alerts.push(g.name+' ('+left+' '+g.unit+' left)');
      });
      const o={no,day,ts:Date.now(),type,items,sub:t.sub,discLabel:t.label,disc:t.disc,adj:t.adj,vatOn:t.vOn,vatRate:t.vr,vatMode:t.incl?'incl':'excl',vatable:t.vatable,vat:t.vat,vatExempt:t.exempt,total:t.total,pay,
        tendered:cash?tend:(onCredit?0:t.total),change:cash?r2(tend-t.total):0,status:'preparing',ingUse:used,cashier:ME.name,cashierUid:ME.uid,
        fee:t.fee,custName:onCredit||isDelivery?custName:'',custPhone:onCredit||isDelivery?custPhone:'',custAddr:isDelivery?custAddr:''};
      if(onCredit)Object.assign(o,{paid:0,payments:[],payDays:[]});
      tx.set(orderRef,o);
      return Object.assign({id:orderRef.id},o);
    });
    cart=[];$('#tender').value='';$('#disc').value='none';$('#customPct').value='';
    resetCustomer();
    if(onCredit)$('#pay').value='Cash';
    if(isDelivery)$('#otype').value='Dine-in';
    placing=false;renderCart();
    showReceipt(order);
    if(alerts.length)toast('Low stock: '+alerts.join(', '),6000);
  }catch(e){
    placing=false;renderTotals();
    toast(errMsg(e));
  }
}

/* ---------- receipt ---------- */
function ono(o){return '#'+String(o.no).padStart(3,'0')}
function bizHeader(){
  return `${S.logo?`<img class="logo" src="${S.logo}" alt="">`:''}<b>${esc(S.shop)}</b>${S.address?'<br>'+esc(S.address).replace(/\n/g,'<br>'):''}${S.phone?'<br>Tel: '+esc(S.phone):''}${S.tin?'<br>'+(S.vatOn?'VAT REG TIN: ':'NON-VAT REG TIN: ')+esc(S.tin):''}`;
}
function showReceipt(ref){
  const o=typeof ref==='string'?(ORDERS.concat(RORDERS,CREDITS).find(x=>x.id===ref)):ref;
  if(!o)return;
  const adj=o.adj||0,vr=o.vatRate||0,excl=o.vatOn&&o.vatMode==='excl';
  const onCredit=o.pay==='Credit',balance=onCredit?r2(o.total-(o.paid||0)):0;
  const row=(a,b,cls)=>`<div class="r ${cls||''}"><span>${a}</span><span>${b}</span></div>`;
  modal(`<div id="receiptPrint" class="receipt">
    <div class="c">${bizHeader()}</div><hr>
    <div>Date: ${dstr(o.ts)} &nbsp;Time: ${tstr(o.ts)}</div>
    <div>Order No: ${ono(o)} &nbsp;(${esc(o.type)})</div>
    <div>Cashier: ${esc(o.cashier||'')}</div>
    ${o.custName?`<div>Customer: ${esc(o.custName)}</div>`:''}
    ${o.type==='Delivery'?`${o.custPhone?`<div>Phone: ${esc(o.custPhone)}</div>`:''}<div>Deliver to: ${esc(o.custAddr||'').replace(/\n/g,'<br>')}</div>`:''}
    <hr>
    <div class="it"><span>ITEM NAME</span><span>QTY</span><span>AMOUNT</span></div>
    <hr>
    ${o.items.map(i=>`<div class="it"><span>${esc(i.name)}${i.size?' ('+esc(i.size)+')':''}</span><span>${i.qty}</span><span>${fmt(i.unit*i.qty)}</span></div>${i.addons.length?`<div class="sm">&nbsp;&nbsp;+ ${esc(i.addons.join(', '))}</div>`:''}${i.note?`<div class="sm">&nbsp;&nbsp;“${esc(i.note)}”</div>`:''}`).join('')}
    <hr>
    ${row('Subtotal',fmt(o.sub))}

async function saveIng(id){
  const name=$('#iN').value.trim();if(!name){toast('Enter a name');return}
  if(ING.some(g=>g.id!==id&&String(g.name).toLowerCase()===name.toLowerCase())){toast('That ingredient already exists');return}
  const pp=parseFloat($('#iPP').value),ps=parseFloat($('#iPS').value),pack=pp>=0&&ps>0;
  const d={name,unit:$('#iU').value,stock:Math.max(0,r2(parseFloat($('#iS').value)||0)),low:Math.max(0,r2(parseFloat($('#iL').value)||0)),
    packPrice:pack?r2(pp):null,packSize:pack?ps:null,ucost:pack?Math.round(pp/ps*1e6)/1e6:null};
  try{
    if(id){
      const ref=fs.collection('ingredients').doc(id);
      await fs.runTransaction(async tx=>{
        const cur=await tx.get(ref);
        if(!cur.exists)throw new Error('This ingredient no longer exists');
        const before=cur.data().stock||0,upd=Object.assign({},d);
        if(d.stock!==before)upd.log=addLog(cur.data().log,'edit',d.stock-before,d.stock);
        tx.update(ref,upd);
      });
    }else{
      if(d.stock>0)d.log=addLog([],'start',d.stock,d.stock);
      await fs.collection('ingredients').add(d);
    }
    closeModal();
  }catch(e){toast(errMsg(e))}
}

/* ----- shared: load + analyze a date range ----- */
const pct=(a,b)=>b>0?(a/b*100).toFixed(1)+'%':'—';
async function loadRange(){
  if(rf>rt)rt=rf;
  try{

}
function orderCost(o){
  if(o.items.some(i=>i.cost==null))return null;
  return r2(o.items.reduce((a,i)=>a+i.cost*i.qty,0));
}
function orderProfit(o){
  const cost=orderCost(o);
  return cost==null?null:r2(o.total-(o.vat||0)-(o.fee||0)-cost); // VAT and delivery fee are not income
}
const owed=o=>r2(o.total-(o.paid||0));
function analyze(){
  const ok=RORDERS.filter(o=>o.status!=='void');
  const A={orders:ok.length,sales:0,vat:0,disc:0,cogs:0,unc:0,exp:0,fees:0,credit:0,unpaid:0,days:{},items:{},byPay:{},byCat:{}};
  const day=k=>A.days[k]||(A.days[k]={sales:0,cogs:0,exp:0});
  ok.forEach(o=>{
    const fee=o.fee||0,rev=o.total-(o.vat||0)-fee; // VAT and delivery fee are not income
    A.sales+=rev;A.vat+=o.vat||0;A.disc+=o.disc||0;A.fees+=fee;
    if(o.pay==='Credit'){A.credit+=o.total;A.unpaid+=owed(o)}
    else A.byPay[o.pay]=(A.byPay[o.pay]||0)+o.total;
    const f=o.sub>0?rev/o.sub:1,d=day(o.day);d.sales+=rev;
    o.items.forEach(i=>{
      const t=A.items[i.name]||(A.items[i.name]={q:0,s:0,c:0,cq:0,unc:0});
      t.q+=i.qty;t.s+=i.unit*i.qty*f; // net of discount
      if(i.cost==null){t.unc+=i.qty;A.unc+=i.qty}
      else{const c=i.cost*i.qty;t.c+=c;t.cq+=i.qty;A.cogs+=c;d.cogs+=c}
    });
  });
  REXP.forEach(e=>{const a=Number(e.amount)||0;A.exp+=a;day(e.date).exp+=a;A.byCat[e.cat]=(A.byCat[e.cat]||0)+a});
  A.sales=r2(A.sales);A.vat=r2(A.vat);A.disc=r2(A.disc);A.cogs=r2(A.cogs);A.exp=r2(A.exp);
  A.fees=r2(A.fees);A.credit=r2(A.credit);A.unpaid=r2(A.unpaid);
  A.gross=r2(A.sales-A.cogs);A.net=r2(A.gross-A.exp);
  Object.values(A.items).forEach(t=>{t.s=r2(t.s);t.c=r2(t.c)});
  return A;
}
function dateRange(a,b){
  const out=[],d=new Date(a+'T12:00:00'),e=new Date(b+'T12:00:00');
  while(d<=e&&out.length<93){out.push(dstr(d.getTime()));d.setDate(d.getDate()+1)}
  return out;

function chartSVG(A){
  const keys=dateRange(rf,rt);
  const rows=keys.map(k=>{const d=A.days[k]||{sales:0,cogs:0,exp:0};return {k,s:d.sales,c:d.cogs,e:d.exp,n:d.sales-d.cogs-d.exp}});
  const W=760,H=270,L=56,R=12,T=14,B=32;
  let mx=Math.max(1,...rows.flatMap(r=>[r.s,r.c,r.e,r.n])),mn=Math.min(0,...rows.map(r=>r.n));
  const raw=(mx-mn)/4,mag=Math.pow(10,Math.floor(Math.log10(raw))),step=[1,2,2.5,5,10].map(m=>m*mag).find(v=>v>=raw)||raw;
  mx=Math.ceil(mx/step)*step;mn=Math.floor(mn/step)*step;
  const y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  const gw=(W-L-R)/rows.length,bw=Math.min(16,gw*.8/3);
  let g='';
  for(let v=mn;v<=mx+1e-9;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?'#8a7a6a':'#eadfd2'}"/><text x="${L-6}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="#7a6a5c">${Math.round(v).toLocaleString('en-PH')}</text>`}
  const every=Math.ceil(rows.length/10);
  const cols=['#6f4e37','#c47f17','#b3392f'];
  rows.forEach((r,i)=>{
    const cx=L+gw*i+gw/2;
    [r.s,r.c,r.e].forEach((v,j)=>{
      const x=cx+(j-1)*bw-bw/2,y0=y(0),y1=y(v);
      g+=`<rect x="${x}" y="${Math.min(y0,y1)}" width="${bw}" height="${Math.max(0.5,Math.abs(y0-y1))}" fill="${cols[j]}" rx="2"><title>${r.k}: ${['Sales','Cost of goods','Expenses'][j]} ${fmt(v)}</title></rect>`;
    });
    if(i%every===0)g+=`<text x="${cx}" y="${H-10}" font-size="11" text-anchor="middle" fill="#7a6a5c">${r.k.slice(5)}</text>`;
  });
  const pts=rows.map((r,i)=>`${L+gw*i+gw/2},${y(r.n)}`).join(' ');
  g+=`<polyline points="${pts}" fill="none" stroke="#2f7d4f" stroke-width="2.5"/>`+rows.map((r,i)=>`<circle cx="${L+gw*i+gw/2}" cy="${y(r.n)}" r="3.5" fill="#2f7d4f"><title>${r.k}: Net profit ${fmt(r.n)}</title></circle>`).join('');
  return `<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:${Math.max(480,rows.length*22)}px">${g}</svg>
  <div class="legend"><span><i style="background:#6f4e37"></i>Sales</span><span><i style="background:#c47f17"></i>Cost of goods</span><span><i style="background:#b3392f"></i>Expenses</span><span><i style="background:#2f7d4f"></i>Net profit (line)</span></div></div>`;
}

/* ----- Z-Reading (end of day) ----- */
let zDate=null,ZCUR=null;
function zCompute(orders,pays){
  const ok=orders.filter(o=>o.status!=='void'),vd=orders.filter(o=>o.status==='void');
  const Z={orders:ok.length,first:null,last:null,gross:0,disc:0,total:0,vatable:0,vat:0,exempt:0,nonvat:0,byPay:{},voids:vd.length,voidAmt:0,fees:0,credit:0,col:{},colTotal:0};
  const nos=ok.map(o=>o.no);if(nos.length){Z.first=Math.min(...nos);Z.last=Math.max(...nos)}
  ok.forEach(o=>{
    Z.gross+=o.sub;Z.disc+=o.disc||0;Z.total+=o.total;Z.fees+=o.fee||0;
    if(o.vatOn){Z.vatable+=o.vatable||0;Z.vat+=o.vat||0;Z.exempt+=o.vatExempt||0}else Z.nonvat+=o.total-(o.fee||0);
    if(o.pay==='Credit')Z.credit+=o.total; // not collected yet
    else Z.byPay[o.pay]=(Z.byPay[o.pay]||0)+o.total;
  });
  (pays||[]).forEach(p=>{Z.col[p.method]=(Z.col[p.method]||0)+p.amt;Z.colTotal+=p.amt}); // credit payments received that day
  vd.forEach(o=>Z.voidAmt+=o.total);
  ['gross','disc','total','vatable','vat','exempt','nonvat','voidAmt','fees','credit','colTotal'].forEach(k=>Z[k]=r2(Z[k]));
  Object.keys(Z.byPay).forEach(k=>Z.byPay[k]=r2(Z.byPay[k]));
  Object.keys(Z.col).forEach(k=>Z.col[k]=r2(Z.col[k]));
  Z.adj=r2(Z.total-Z.fees-Z.gross+Z.disc);
  return Z;
}
async function zLoad(date){ // orders sold that day + credit payments received that day
  const [sold,paid]=await Promise.all([
    fs.collection('orders').where('day','==',date).get(),
    fs.collection('orders').where('payDays','array-contains',date).get()]);
  const orders=sold.docs.map(d=>d.data()),pays=[];
  paid.docs.forEach(d=>{const o=d.data();(o.payments||[]).forEach(p=>{if(p.date===date)pays.push(Object.assign({no:o.no,cust:o.custName},p))})});
  return {orders,pays};
}

    ${fees?pn('Add: delivery fees','+ '+fmt(fees)):''}
    ${credit||colTotal
      ?`<div class="r"><b>NET SALES</b><b>${fmt(Z.total)}</b></div>${credit?pn('Less: credit sales (unpaid)','− '+fmt(credit)):''}${pn('Collected from sales',fmt(fromSales))}${colTotal?pn('Add: credit payments received','+ '+fmt(colTotal)):''}<div class="r"><b>TOTAL COLLECTED</b><b>${fmt(r2(fromSales+colTotal))}</b></div>`

    ${Z.vatable||Z.vat||S.vatOn?pn('VATable sales',fmt(Z.vatable))+pn('VAT amount',fmt(Z.vat)):''}
    ${Z.exempt?pn('VAT-exempt sales',fmt(Z.exempt)):''}${Z.nonvat?pn('Non-VAT sales',fmt(Z.nonvat)):''}<hr>
    <div><b>Payments</b></div>${payRows||pn('—','')}<hr>
    ${pn('Voided orders',Z.voids+' ('+fmt(Z.voidAmt)+')')}

    ${saved.counted==null?'':pn('Counted cash',fmt(saved.counted))+pn('Over / (short)',fmt(r2(saved.counted-((saved.float||0)+cashIn))))}`:''}
  </div>`;
}

async function voidOrder(id){
  const o=RORDERS.find(x=>x.id===id);
  if(!o||!confirm('Void order '+ono(o)+'? Stock and ingredients will be restored.'))return;
  try{
    await fs.runTransaction(async tx=>{
      const oref=fs.collection('orders').doc(id);
      const od=await tx.get(oref);
      if(!od.exists||od.data().status==='void')throw new Error('This order is already void');
      if(od.data().pay==='Credit'&&(od.data().paid||0)>0)throw new Error('This credit order already has payments, so it cannot be voided.');
      const back={};od.data().items.forEach(i=>{back[i.id]=(back[i.id]||0)+i.qty});
      const md=await Promise.all(Object.keys(back).map(k=>tx.get(fs.collection('menu').doc(k))));
      const iu=od.data().ingUse||{};
      const idocs=await Promise.all(Object.keys(iu).map(k=>tx.get(fs.collection('ingredients').doc(k))));
      md.forEach(d=>{if(d.exists&&d.data().track)tx.update(d.ref,{stock:(d.data().stock||0)+back[d.id]})});
      idocs.forEach(d=>{if(!d.exists)return;const back=r2((d.data().stock||0)+iu[d.id]);tx.update(d.ref,{stock:back,log:addLog(d.data().log,'void',iu[d.id],back,'#'+String(od.data().no).padStart(3,'0'))})});
      tx.update(oref,{status:'void',voidedBy:ME.name,voidedAt:Date.now()});
    });
    toast('Order voided');aReports();
  }catch(e){toast(errMsg(e))}
}

async function loadCredits(){

function creditGroups(){ // unpaid credit orders, grouped by customer name
  const groups={};
  CREDITS.filter(o=>owed(o)>0).forEach(o=>{
    const key=String(o.custName||'').trim().toLowerCase();
    const g=groups[key]||(groups[key]={name:o.custName||'(no name)',phone:'',orders:[],bal:0});
    g.orders.push(o);g.bal=r2(g.bal+owed(o));
    if(o.custPhone)g.phone=o.custPhone;
  });
  return Object.values(groups).sort((a,b)=>b.bal-a.bal);
}
const oldestTs=g=>Math.min(...g.orders.map(o=>o.ts));
async function aCredits(){

function viewCredit(i){

  <div class="actions"><button class="ghost" onclick="closeModal()">Close</button><button class="ok" onclick="payCredit(${i})">Receive payment</button></div>`);
  $('#modal').classList.add('wide');
}
function payCredit(i){
  const g=CGROUPS[i];if(!g)return;
  payTarget=g;
  modal(`<h3>Receive payment</h3><div><b>${esc(g.name)}</b> owes ${fmt(g.bal)}</div>
  <div class="two"><div><div class="lbl">Amount</div><input id="cpA" type="number" min="0" step="0.01" value="${g.bal}"></div>
  <div><div class="lbl">Paid by</div><select id="cpM"><option>Cash</option><option>GCash</option></select></div></div>
  <small style="color:var(--mut)">A partial payment is fine. It goes to the oldest unpaid order first.</small>
  <div class="actions"><button class="ghost" onclick="closeModal()">Cancel</button><button id="cpBtn" class="ok" onclick="saveCreditPay()">Save payment</button></div>`);
}
async function saveCreditPay(){
  const g=payTarget;if(!g||paying)return;
  const amount=r2(parseFloat($('#cpA').value)||0),method=$('#cpM').value;
  if(!(amount>0)){toast('Enter an amount greater than 0');return}
  if(amount>g.bal){toast('That is more than the balance ('+fmt(g.bal)+')');return}
  if(!navigator.onLine){toast('No internet. A connection is needed to save the payment.');return}
  paying=true;$('#cpBtn').disabled=true;
  const ids=g.orders.slice().sort((a,b)=>a.ts-b.ts).map(o=>o.id),day=todayStr(),ts=Date.now();
  try{
    await fs.runTransaction(async tx=>{
      const docs=await Promise.all(ids.map(id=>tx.get(fs.collection('orders').doc(id))));
      let left=amount;
      docs.forEach(d=>{
        if(left<=0||!d.exists)return;
        const o=d.data();if(o.status==='void')return;
        const balance=r2(o.total-(o.paid||0));if(balance<=0)return;
        const take=Math.min(balance,left);left=r2(left-take);
        const days=(o.payDays||[]).includes(day)?o.payDays:(o.payDays||[]).concat(day);
        tx.update(d.ref,{paid:r2((o.paid||0)+take),payments:(o.payments||[]).concat({ts,date:day,amt:r2(take),method,by:ME.name}),payDays:days});
      });
      if(left>0)throw new Error('The balance changed. Please refresh and try again.');
    });
    paying=false;closeModal();toast('Payment saved');aCredits();
  }catch(e){paying=false;const b=$('#cpBtn');if(b)b.disabled=false;toast(errMsg(e))}
}

const LIB_URLS={xlsx:'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
  pdf:'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
  table:'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'};
function loadScript(src){
  return new Promise((ok,fail)=>{
    const s=document.createElement('script');s.src=src;s.onload=ok;
    s.onerror=()=>fail(new Error('Could not load the export tool. Check your internet connection.'));
    document.head.appendChild(s);
  });
}
async function needLib(type){ // loaded only when you export, so the POS stays light
  if(type==='xlsx'&&!window.XLSX)await loadScript(LIB_URLS.xlsx);
  if(type==='pdf'&&!(window.jspdf&&window.jspdf.jsPDF)){
    await loadScript(LIB_URLS.pdf);
    if(!window.jsPDF)window.jsPDF=window.jspdf.jsPDF; // the table plugin looks for this name
    await loadScript(LIB_URLS.table);
  }
}
function exportButtons(kind){
  return `<button class="ghost" onclick="exportReport('${kind}','xlsx')">Export Excel</button><button class="ghost" onclick="exportReport('${kind}','pdf')">Export PDF</button>`;
}
async function exportReport(kind,type){
  const build={dash:dashDoc,sales:salesDoc,exp:expDoc,zread:zDoc,credits:creditsDoc}[kind];
  let doc;
  try{doc=build()}catch(e){toast('Nothing to export yet. Wait for the page to load and try again.');return}
  try{
    toast('Preparing '+(type==='xlsx'?'Excel':'PDF')+' file…',1500);
    await needLib(type);
    if(type==='xlsx')makeXlsx(doc);else makePdf(doc);
  }catch(e){toast(errMsg(e),4000)}
}
const numFmt=n=>(Number(n)||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const pdfText=s=>String(s==null?'':s).replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/[–—−]/g,'-').replace(/₱/g,'PHP ').replace(/[^\x00-\xFF]/g,'?'); // PDF font has no peso sign
function makeXlsx(doc){
  const wb=XLSX.utils.book_new(),used={Summary:1};
  const sheetName=n=>{const base=String(n).replace(/[\\\/?*\[\]:]/g,' ').slice(0,28)||'Sheet';let k=base,i=2;while(used[k])k=base+' '+(i++);used[k]=1;return k};
  const longest=(rows,c)=>rows.reduce((m,r)=>Math.max(m,String(r[c]==null?'':r[c]).length),0);
  // summary sheet: title, subtitle, then label/value rows
  const labels=doc.summary.map(r=>Array.isArray(r)?[r[0],r[1]]:[String(r.h).toUpperCase()]);
  const ws=XLSX.utils.aoa_to_sheet([[S.shop+' - '+doc.title],[doc.sub],[]].concat(labels));
  doc.summary.forEach((r,i)=>{
    if(!Array.isArray(r)||!r[2])return;
    const cell=ws[XLSX.utils.encode_cell({r:i+3,c:1})];
    if(cell&&cell.t==='n')cell.z='#,##0.00';
  });
  ws['!cols']=[{wch:Math.min(50,Math.max(16,longest(labels,0)+2))},{wch:20}];
  XLSX.utils.book_append_sheet(wb,ws,'Summary');
  doc.sections.forEach(s=>{
    const sheet=XLSX.utils.aoa_to_sheet([s.cols].concat(s.rows));
    (s.money||[]).forEach(c=>s.rows.forEach((_,r)=>{
      const cell=sheet[XLSX.utils.encode_cell({r:r+1,c})];
      if(cell&&cell.t==='n')cell.z='#,##0.00';
    }));
    sheet['!cols']=s.cols.map((h,c)=>({wch:Math.min(50,Math.max(String(h).length,longest(s.rows,c))+2)}));
    if(s.rows.length)sheet['!autofilter']={ref:sheet['!ref']};
    XLSX.utils.book_append_sheet(wb,sheet,sheetName(s.h));
  });
  XLSX.writeFile(wb,doc.file+'.xlsx');
}
function makePdf(doc){
  const pdf=new window.jspdf.jsPDF({orientation:doc.wide?'landscape':'portrait',unit:'pt',format:'a4'});
  if(typeof pdf.autoTable!=='function')throw new Error('The PDF tool did not load properly. Refresh the page and try again.');
  const pageW=pdf.internal.pageSize.getWidth(),pageH=pdf.internal.pageSize.getHeight(),m=40;
  let y=m;
  pdf.setFont('helvetica','bold');pdf.setFontSize(16);pdf.setTextColor(111,78,55);
  pdf.text(pdfText(S.shop+' - '+doc.title),m,y);
  pdf.setFont('helvetica','normal');pdf.setFontSize(10);pdf.setTextColor(120,120,120);
  pdf.text(pdfText(doc.sub+'   |   Amounts in PHP'),m,y+16);
  y+=30;
  if(doc.summary.length){
    const body=doc.summary.map(r=>Array.isArray(r)
      ?[pdfText(r[0]),pdfText(r[2]&&typeof r[1]==='number'?numFmt(r[1]):r[1])]
      :[{content:pdfText(r.h),colSpan:2,styles:{fontStyle:'bold',fillColor:[240,232,222]}}]);
    pdf.autoTable({startY:y,body,theme:'plain',margin:{left:m,right:m},tableWidth:Math.min(400,pageW-2*m),
      styles:{fontSize:10,cellPadding:3,textColor:[43,32,24]},columnStyles:{1:{halign:'right'}}});
    y=pdf.lastAutoTable.finalY+18;
  }
  doc.sections.forEach(s=>{
    if(y>pageH-110){pdf.addPage();y=m}
    pdf.setFont('helvetica','bold');pdf.setFontSize(12);pdf.setTextColor(43,32,24);
    pdf.text(pdfText(s.h),m,y);
    const money=s.money||[],colStyle={};
    money.forEach(c=>{colStyle[c]={halign:'right'}});
    Object.entries(s.widths||{}).forEach(([c,w])=>{colStyle[c]=Object.assign(colStyle[c]||{},{cellWidth:w})});
    const body=s.rows.length
      ?s.rows.map(r=>r.map((v,c)=>pdfText(money.includes(c)&&typeof v==='number'?numFmt(v):v)))
      :[[{content:'No data',colSpan:s.cols.length}]];
    pdf.autoTable({startY:y+6,head:[s.cols.map(pdfText)],body,margin:{left:m,right:m},
      styles:{fontSize:doc.wide?8:9,cellPadding:3},headStyles:{fillColor:[111,78,55],textColor:255},
      alternateRowStyles:{fillColor:[250,246,240]},columnStyles:colStyle,
      didParseCell:h=>{if(h.section==='head'&&money.includes(h.column.index))h.cell.styles.halign='right'}});
    y=pdf.lastAutoTable.finalY+22;
  });
  const pages=pdf.internal.getNumberOfPages(),now=Date.now();
  for(let i=1;i<=pages;i++){
    pdf.setPage(i);pdf.setFont('helvetica','normal');pdf.setFontSize(8);pdf.setTextColor(140,140,140);
    pdf.text('Page '+i+' of '+pages,pageW-m,pageH-20,{align:'right'});
    pdf.text('Printed '+dstr(now)+' '+tstr(now),m,pageH-20);
  }
  pdf.save(doc.file+'.pdf');
}

function salesDoc(){

    ['Total discount',A.disc,1],['Cost of goods',A.cogs,1],['Gross profit',A.gross,1],['Gross margin',pct(A.gross,A.sales)]];
  if(A.vat)summary.push(['VAT collected',A.vat,1]);

  Object.entries(A.byPay).forEach(([k,v])=>summary.push([k+' payments',r2(v),1]));

    return [n,t.q,t.s,t.cq?r2(t.c/t.cq):'',full?t.c:'',full?r2(t.s-t.c):'',full?pct(t.s-t.c,t.s):''];
  });

  });
  return {title:'Sales Report',sub:rangeText(),file:'sales_'+rf+'_to_'+rt,wide:true,summary,sections:[
    {h:'Items sold',cols:['Item','Sold','Sales','Cost / unit','Total cost','Profit','Margin'],rows:items,money:[2,3,4,5]},

function zDoc(){
  const {Z,saved,date}=ZCUR;
  const credit=Z.credit||0,fees=Z.fees||0,col=Z.col||{},colTotal=Z.colTotal||0;
  const cashSales=Z.byPay.Cash||0,cashIn=r2(cashSales+(col.Cash||0)),fromSales=r2(Z.total-credit);
  const rows=[],add=(label,value,isMoney)=>rows.push([label,value,isMoney?1:0]),head=t=>rows.push({h:t});
  add('Date',date);
  if(saved){add('Z-counter','#'+String(saved.z).padStart(4,'0'));add('Printed by',saved.by||'');add('Saved at',dstr(saved.ts)+' '+tstr(saved.ts))}
  if(S.tin)add('TIN',S.tin);
  add('Orders',Z.orders);
  if(Z.orders)add('First / last order','#'+String(Z.first).padStart(3,'0')+' / #'+String(Z.last).padStart(3,'0'));
  head('Sales');
  add('Gross sales',Z.gross,1);add('Less: discounts',-Z.disc,1);
  if(Z.adj)add(Z.adj<0?'Less: VAT exemption':'Add: VAT on top',Z.adj,1);
  if(fees)add('Add: delivery fees',fees,1);
  if(credit||colTotal){
    add('NET SALES',Z.total,1);
    if(credit)add('Less: credit sales (unpaid)',-credit,1);
    add('Collected from sales',fromSales,1);
    if(colTotal)add('Add: credit payments received',colTotal,1);
    add('TOTAL COLLECTED',r2(fromSales+colTotal),1);
  }else add('NET COLLECTED',Z.total,1);
  if(Z.vatable||Z.vat||S.vatOn){head('Tax');add('VATable sales',Z.vatable,1);add('VAT amount',Z.vat,1)}
  if(Z.exempt)add('VAT-exempt sales',Z.exempt,1);
  if(Z.nonvat)add('Non-VAT sales',Z.nonvat,1);
  head('Payments');
  Object.entries(Z.byPay).forEach(([k,v])=>add(k,v,1));
  Object.entries(col).forEach(([k,v])=>add('Credit payment ('+k+')',v,1));
  if(credit)add('On credit (unpaid)',credit,1);
  add('Voided orders',Z.voids+' ('+numFmt(Z.voidAmt)+')');
  if(saved){
    head('Cash drawer');
    add('Opening float',saved.float||0,1);add('Cash sales',cashSales,1);
    if(col.Cash)add('Credit payments (cash)',col.Cash,1);
    add('Expected cash',r2((saved.float||0)+cashIn),1);
    if(saved.counted!=null){add('Counted cash',saved.counted,1);add('Over / (short)',r2(saved.counted-((saved.float||0)+cashIn)),1)}
  }
  return {title:saved?'Z-Reading':'X-Reading (preview, not saved)',sub:date,file:'zreading_'+date,summary:rows,sections:[]};
}

  <td>${u.active?'Active':'<span class="low">Disabled</span>'}</td>
  <td class="n">${self?'':`<button class="ghost" onclick="setActive(${i},${!u.active})">${u.active?'Disable':'Enable'}</button> `}<button class="ghost" onclick="resetPw(${i})">Reset password</button></td></tr>`}).join('')}</table>
  <p style="color:var(--mut)">New staff sign in with the email and password you set here. Accounts cannot be deleted; disable them instead.</p>`;
}
async function addStaff(){
  const name=$('#stN').value.trim(),email=$('#stE').value.trim(),pass=$('#stP').value,role=$('#stR').value;
  if(!name||!email){toast('Please fill in the name and email');return}
  if(pass.length<6){toast('Password is too short (min 6 characters)');return}
  $('#stBtn').disabled=true;
  let sec=null,shown=false;
  try{
    // second app instance so the admin stays logged in
    sec=firebase.initializeApp(FIREBASE_CONFIG,'sec'+Date.now());
    const cred=await sec.auth().createUserWithEmailAndPassword(email,pass);
    try{
      await fs.collection('users').doc(cred.user.uid).set({name,email,role,active:true,createdAt:Date.now(),createdBy:ME.uid});
    }catch(e){
      toast('The login was created but the profile was not saved: '+errMsg(e));
      shown=true;throw e;
    }
    await sec.auth().signOut();
    toast('Added '+name);
  }catch(e){if(!shown)toast(errMsg(e))}
  finally{if(sec){try{await sec.delete()}catch(_){}}}
  aStaff();
}
async function setRole(i,role){
  const u=STAFF[i];if(!u)return;
  try{await fs.collection('users').doc(u.uid).update({role});toast('Role updated');}catch(e){toast(errMsg(e))}
  aStaff();
}
async function setActive(i,active){
  const u=STAFF[i];if(!u)return;
  try{await fs.collection('users').doc(u.uid).update({active})}catch(e){toast(errMsg(e))}
  aStaff();
}
async function resetPw(i){
  const u=STAFF[i];if(!u)return;
  try{await auth.sendPasswordResetEmail(u.email);toast('Password reset email sent to '+u.name)}catch(e){toast(errMsg(e))}
}

/* ----- settings ----- */
function aSettings(){
  $('#aContent').innerHTML=`<div class="lbl" style="margin-top:0">Shop name</div><input id="sShop" value="${esc(S.shop)}">
  <div class="lbl">PWD / Senior discount (%)</div><input id="sPwd" type="number" min="0" max="100" value="${S.pwdRate}">
  <h4>Receipt details &amp; VAT</h4>
  <div class="lbl" style="margin-top:0">Receipt logo (printed at the top)</div>
  <div id="logoPrev" style="margin:6px 0"></div>
  <input id="sLogoFile" type="file" accept="image/*" onchange="pickLogo(this)">
  <label style="display:flex;gap:8px;align-items:center;margin-top:8px"><input id="sLogoBW" type="checkbox" style="width:auto" checked> Convert to black &amp; white (best for thermal printers)</label>
  <button class="ghost" style="margin-top:8px" onclick="clearLogo()">Remove logo</button>
  <div class="lbl">Business address (shown on receipts)</div><textarea id="sAddr" rows="2">${esc(S.address||'')}</textarea>
  <div class="lbl">Phone (optional)</div><input id="sPhone" value="${esc(S.phone||'')}" placeholder="(02) 1234 5678">
  <div class="lbl">TIN</div><input id="sTin" value="${esc(S.tin||'')}" placeholder="000-000-000-000">
  <div class="lbl">Receipt footer message (printed under "Thank you!", up to 3 lines)</div><textarea id="sFoot" rows="3" placeholder="Please ask our staff for an invoice.">${esc(S.footer||'')}</textarea>
  <label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input id="sVatOn" type="checkbox" style="width:auto" ${S.vatOn?'checked':''}> Business is VAT-registered (enable VAT)</label>
  <div class="two"><div><div class="lbl">VAT rate (%)</div><input id="sVatRate" type="number" min="0" max="100" step="0.01" value="${S.vatRate}"></div>
  <div><div class="lbl">Menu prices</div><select id="sVatMode"><option value="incl" ${S.vatMode!=='excl'?'selected':''}>Already include VAT</option><option value="excl" ${S.vatMode==='excl'?'selected':''}>Exclude VAT (add on top)</option></select></div></div>
  <label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input id="sPwdEx" type="checkbox" style="width:auto" ${S.pwdVatExempt!==false?'checked':''}> PWD/Senior sales are VAT-exempt (discount is taken on the price without VAT)</label>
  <label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input id="sBlock" type="checkbox" style="width:auto" ${S.blockOnOut!==false?'checked':''}> Block a sale when an ingredient is not enough</label>
  <small style="color:var(--mut)">When off, the sale goes through and the stock stops at zero with an OUT alert.</small>
  <h4>Menu options</h4>
  <div class="lbl">Sizes (one per line: Name, extra price, extra cost, recipe multiplier)</div><textarea id="sSizes" rows="4">${esc(S.sizes.map(z=>z.n+','+z.up+','+(z.cost||0)+','+(z.mult||1)).join('\n'))}</textarea>
  <small style="color:var(--mut)">Example: Large,20,6,1.5 means +₱20 price, +₱6 cost, and 1.5× the recipe amounts.</small>
  <div class="lbl">Add-ons (one per line: Name, price, cost)</div><textarea id="sAdd" rows="5">${esc(S.addons.map(a=>a.n+','+a.p+','+(a.cost||0)).join('\n'))}</textarea>
  <small style="color:var(--mut)">Add-on example: Extra shot,20,6 means ₱20 price and ₱6 cost. What it uses up is set in the Ingredients tab.</small>
  <div class="actions" style="justify-content:flex-start"><button onclick="saveSettings()">Save settings</button></div>`;
  pendingLogo=undefined;logoPrev();
}
function parseSizes(t){
  const num=(x,d)=>{const v=parseFloat(x);return isNaN(v)?d:Math.max(0,v)};
  return t.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const p=l.split(',').map(x=>x.trim());
    if(p.length>=4)return {n:p.slice(0,-3).join(','),up:num(p[p.length-3],0),cost:num(p[p.length-2],0),mult:num(p[p.length-1],1)||1};
    if(p.length===3)return {n:p[0],up:num(p[1],0),cost:num(p[2],0),mult:1};
    if(p.length===2)return {n:p[0],up:num(p[1],0),cost:0,mult:1};
    return {n:p[0],up:0,cost:0,mult:1};
  }).filter(x=>x.n);
}
function parseLines(t){
  const num=x=>{const v=parseFloat(x);return isNaN(v)?0:Math.max(0,v)};
  return t.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const p=l.split(',').map(x=>x.trim());
    if(p.length>=3)return {n:p.slice(0,-2).join(','),v:num(p[p.length-2]),c:num(p[p.length-1])};
    if(p.length===2)return {n:p[0],v:num(p[1]),c:0};
    return {n:p[0],v:0,c:0};
  }).filter(x=>x.n);
}
let pendingLogo; // undefined = unchanged, '' = remove, data URL = new logo
function logoPrev(){
  const v=pendingLogo!==undefined?pendingLogo:S.logo,el=$('#logoPrev');
  if(el)el.innerHTML=v?`<img src="${v}" alt="" style="max-width:200px;max-height:90px;background:#fff;border:1px solid var(--line);padding:4px"><div style="color:var(--mut);font-size:12px">${pendingLogo!==undefined?'Not saved yet. Press Save settings.':'Current logo'}</div>`:'<small style="color:var(--mut)">No logo set</small>';
}
function pickLogo(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  if(!f.type.startsWith('image/')){toast('Please choose an image file');return}
  if(f.size>5*1024*1024){toast('Image is too large (max 5 MB)');return}
  const rd=new FileReader();
  rd.onerror=()=>toast('Could not read that file');
  rd.onload=()=>{
    const img=new Image();
    img.onerror=()=>toast('That image could not be opened');
    img.onload=()=>{
      try{
        let w=Math.min(240,img.width),h=Math.round(img.height*w/img.width);
        if(h>120){h=120;w=Math.round(img.width*h/img.height)}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
        if($('#sLogoBW').checked){
          const d=x.getImageData(0,0,w,h),p=d.data;
          for(let i=0;i<p.length;i+=4){const g=.299*p[i]+.587*p[i+1]+.114*p[i+2],v=g<170?0:255;p[i]=p[i+1]=p[i+2]=v}
          x.putImageData(d,0,0);
        }
        const url=c.toDataURL('image/png');
        if(url.length>600000){toast('That image is too detailed. Try a simpler logo.');return}
        pendingLogo=url;logoPrev();toast('Logo ready. Press Save settings.');
      }catch(e){toast('Could not process the image')}
    };
    img.src=rd.result;
  };
  rd.readAsDataURL(f);
}
function clearLogo(){pendingLogo='';const f=$('#sLogoFile');if(f)f.value='';logoPrev()}
async function saveSettings(){
  const sizes=parseSizes($('#sSizes').value);
  if(!sizes.length){toast('At least one size is required');return}
  const d={shop:$('#sShop').value.trim()||'Coffee Shop',pwdRate:Math.min(100,Math.max(0,parseFloat($('#sPwd').value)||0)),
    sizes,addons:parseLines($('#sAdd').value).map(x=>({n:x.n,p:x.v,cost:x.c}))};
  Object.assign(d,{address:$('#sAddr').value.trim(),phone:$('#sPhone').value.trim(),tin:$('#sTin').value.trim(),footer:$('#sFoot').value.trim(),
    vatOn:$('#sVatOn').checked,vatRate:Math.min(100,Math.max(0,parseFloat($('#sVatRate').value)||0)),vatMode:$('#sVatMode').value,pwdVatExempt:$('#sPwdEx').checked,blockOnOut:$('#sBlock').checked});
  if(d.vatOn&&!(d.vatRate>0)){toast('Enter a VAT rate above 0');return}
  if(pendingLogo!==undefined)d.logo=pendingLogo;
  try{await fs.collection('settings').doc('main').set(d,{merge:true});pendingLogo=undefined;toast('Saved')}catch(e){toast(errMsg(e))}
}
